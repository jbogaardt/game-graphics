<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sprite viewer</title>
<script type="importmap">{ "imports": { "pixi.js": "/vendor/pixi.mjs" } }</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #hud { position: fixed; left: 8px; top: 6px; font: 12px/1.5 ui-monospace, monospace; color: #e8e8e8; text-shadow: 0 1px 2px #000; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<div id="hud"></div>
<script type="module">
// Plays dist/<name>_doll.png exactly the way ../me_rpg does (src/sprites/doll.ts + src/entities/Character.ts):
// the same animation blocks, cycles and timings, feet anchor, shadow, walk speed and integer camera zoom.
import { Application, Container, Graphics, Rectangle, Sprite, Texture, Assets, TextureStyle } from 'pixi.js';

TextureStyle.defaultOptions.scaleMode = 'nearest';

// ---- copied from ../me_rpg (keep in step with src/sprites/doll.ts, src/core/camera.ts, overworld SPEED) ----
const ANIMS = {
  walk: { y: 0, size: 64, cols: 9, rows: 4, cycle: [1, 2, 3, 4, 5, 6, 7, 8], ms: 90, once: false },
  idle: { y: 256, size: 64, cols: 2, rows: 4, cycle: [0, 0, 0, 1], ms: 350, once: false },
  cast: { y: 512, size: 64, cols: 7, rows: 4, cycle: [0, 1, 2, 3, 4, 5, 6], ms: 60, once: true },
  hurt: { y: 768, size: 64, cols: 6, rows: 1, cycle: [0, 1, 2, 3, 4, 5], ms: 70, once: true },
  slash: { y: 832, size: 128, cols: 6, rows: 4, cycle: [0, 1, 2, 3, 4, 5], ms: 55, once: true },
  shoot: { y: 1344, size: 64, cols: 13, rows: 4, cycle: [5, 6, 7, 8, 9, 10, 11, 12], ms: 50, once: true },
};
const DIR_ROW = { up: 0, left: 1, down: 2, right: 3 };
const FEET_Y_64 = 62;
const feetAnchor = (anim) => (FEET_Y_64 + (ANIMS[anim].size - 64) / 2) / ANIMS[anim].size;
const pickZoom = (w, h) => Math.max(1, Math.round(Math.min(w / 640, h / 440)));
const SPEED = 120; // px per second
const CELL = 32;   // map tile size
// -------------------------------------------------------------------------------------------------------------

const app = new Application();
await app.init({ background: '#000000', resizeTo: window, antialias: false, roundPixels: true, resolution: devicePixelRatio || 1, autoDensity: true });
document.body.prepend(app.canvas);

const world = new Container();
const ground = new Graphics();
const shadow = new Graphics().ellipse(0, 0, 10, 4).fill({ color: 0x000000, alpha: 0.35 });
const body = new Sprite();
const actor = new Container();
actor.addChild(shadow, body);
world.addChild(ground, actor);
app.stage.addChild(world);

const names = await (await fetch('/api/sprites')).json();
const query = new URLSearchParams(location.search);
let name = query.get('sprite') ?? names[0];
let frames = null;

async function load() {
  const url = `/dist/${name}_doll.png?v=${Date.now()}`;
  const base = await Assets.load(url);
  frames = {};
  for (const [anim, a] of Object.entries(ANIMS)) {
    frames[anim] = {};
    for (const dir of Object.keys(DIR_ROW)) {
      const row = a.rows === 1 ? 0 : DIR_ROW[dir];
      frames[anim][dir] = Array.from({ length: a.cols }, (_, col) =>
        new Texture({ source: base.source, frame: new Rectangle(col * a.size, a.y + row * a.size, a.size, a.size) }));
    }
  }
}

// state, as in Character: looping idle/walk unless a one-shot action is playing
const st = { x: 0, y: 0, dir: 'down', loopAnim: 'idle', loopTime: 0, action: null };
const keys = new Set();
const ACTIONS = { 1: 'slash', 2: 'cast', 3: 'shoot', h: 'hurt' };
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (ACTIONS[k]) st.action = { anim: ACTIONS[k], time: 0 };
  else if (k === 'r') load();
  else if (k === 'n' && names.length > 1) { name = names[(names.indexOf(name) + 1) % names.length]; load(); }
  keys.add(k);
});
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

function pose(dt, moving) {
  const act = st.action;
  if (act) {
    act.time += dt;
    const { cycle, ms } = ANIMS[act.anim];
    const step = Math.floor(act.time / ms);
    if (step < cycle.length) return [act.anim, cycle[step]];
    st.action = null;
  }
  const anim = moving ? 'walk' : 'idle';
  if (anim !== st.loopAnim) st.loopTime = 0;
  st.loopAnim = anim;
  st.loopTime += dt;
  const { cycle, ms } = ANIMS[anim];
  return [anim, cycle[Math.floor(st.loopTime / ms) % cycle.length]];
}

function drawGround(zoom) {
  // a plain tiled field: enough to see the feet land and the sprite move, no more
  const w = Math.ceil(app.screen.width / zoom / CELL) + 2, h = Math.ceil(app.screen.height / zoom / CELL) + 2;
  ground.clear();
  for (let ty = -h; ty <= h; ty++)
    for (let tx = -w; tx <= w; tx++)
      ground.rect(tx * CELL, ty * CELL, CELL, CELL).fill((tx + ty) & 1 ? 0x5d7d43 : 0x587640);
}

await load();
let lastZoom = 0;
app.ticker.add((t) => {
  if (!frames) return;
  const dt = t.deltaMS;
  const dx = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
  const dy = (keys.has('s') || keys.has('arrowdown') ? 1 : 0) - (keys.has('w') || keys.has('arrowup') ? 1 : 0);
  const moving = (dx || dy) && !st.action;
  if (moving) {
    st.dir = dx ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up';
    const n = Math.hypot(dx, dy);
    st.x += (dx / n) * SPEED * dt / 1000;
    st.y += (dy / n) * SPEED * dt / 1000;
  }
  const [anim, col] = pose(dt, moving);
  body.texture = frames[anim][st.dir][col];
  body.anchor.set(0.5, feetAnchor(anim));
  const zoom = pickZoom(app.screen.width, app.screen.height);
  if (zoom !== lastZoom) { drawGround(zoom); lastZoom = zoom; }
  world.scale.set(zoom);
  // camera follows the actor; the field repeats every 2 tiles so it is drawn once and wrapped
  const wrap = 2 * CELL;
  ground.position.set(Math.floor(st.x / wrap) * wrap, Math.floor(st.y / wrap) * wrap);
  actor.position.set(Math.round(st.x), Math.round(st.y));
  world.position.set(Math.round(app.screen.width / 2 - st.x * zoom), Math.round(app.screen.height / 2 - st.y * zoom));
  document.getElementById('hud').textContent =
    `${name}  ${anim} ${st.dir} col ${col}   zoom ${zoom}x\nWASD move  1 slash  2 cast  3 shoot  H hurt  R reload${names.length > 1 ? '  N next sprite' : ''}`;
});
</script>
</body>
</html>
